<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<meta name="theme-color" content="#f6f7fb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Teacher Planner">

<link rel="manifest" href="manifest.json">

<title>Teacher Planner</title>

<style>
:root{
  --bg:#f6f7fb;
  --card:#ffffff;
  --text:#17181c;
  --muted:#7c7f89;
  --line:#ececf1;
  --purple:#6557d9;
  --purple-soft:#efedff;
  --blue-soft:#edf7ff;
  --danger:#e95d67;
  --shadow:0 8px 28px rgba(30,30,60,.07);
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Inter,Segoe UI,sans-serif;
  -webkit-font-smoothing:antialiased;
}

button,
input,
select,
textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

.app{
  min-height:100vh;
  padding-bottom:92px;
}

/* TOP */

.top{
  padding:44px 30px 18px;
}

.date{
  color:#858893;
  font-size:16px;
  margin-bottom:10px;
}

.header{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:16px;
}

.greeting{
  font-size:38px;
  line-height:1.08;
  font-weight:750;
  letter-spacing:-1.4px;
  max-width:390px;
}

.avatar{
  width:78px;
  height:78px;
  border-radius:26px;
  border:0;
  background:#191a1e;
  color:#fff;
  font-size:27px;
  display:flex;
  align-items:center;
  justify-content:center;
  flex:none;
  box-shadow:0 8px 20px rgba(0,0,0,.09);
}

.content{
  padding:0 30px;
}

/* STATS */

.stats{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px;
  margin:18px 0 24px;
}

.stat{
  min-height:128px;
  border-radius:28px;
  padding:28px;
}

.stat.lessons{
  background:var(--purple-soft);
}

.stat.students{
  background:var(--blue-soft);
}

.stat-number{
  font-size:42px;
  font-weight:700;
  line-height:1;
}

.stat-label{
  margin-top:22px;
  color:#737681;
  font-size:16px;
}

/* CARD */

.card{
  background:var(--card);
  border:1px solid rgba(0,0,0,.035);
  border-radius:30px;
  box-shadow:var(--shadow);
  padding:28px;
  margin-bottom:18px;
}

.card-title{
  font-size:25px;
  font-weight:720;
  letter-spacing:-.5px;
}

.card-sub{
  color:var(--muted);
  margin-top:5px;
  font-size:16px;
}

.empty{
  min-height:165px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#8a8d96;
  font-size:17px;
  text-align:center;
}

/* LESSON */

.lesson-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:16px 0;
  border-bottom:1px solid var(--line);
}

.lesson-row:last-child{
  border-bottom:0;
}

.lesson-main{
  min-width:0;
}

.lesson-name{
  font-weight:650;
  font-size:17px;
}

.lesson-meta{
  color:var(--muted);
  font-size:14px;
  margin-top:5px;
}

.badge{
  background:var(--purple-soft);
  color:var(--purple);
  border-radius:12px;
  padding:7px 10px;
  font-size:13px;
  font-weight:650;
  white-space:nowrap;
}

/* BUTTONS */

.section-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:18px;
}

.primary{
  border:0;
  background:var(--purple);
  color:white;
  padding:12px 16px;
  border-radius:15px;
  font-weight:650;
  box-shadow:0 6px 16px rgba(101,87,217,.2);
}

.secondary{
  border:1px solid var(--line);
  background:white;
  color:var(--text);
  padding:11px 14px;
  border-radius:14px;
  font-weight:600;
}

.danger{
  border:0;
  background:#fff0f1;
  color:var(--danger);
  padding:9px 11px;
  border-radius:12px;
  font-weight:600;
}

/* DAYS */

.tabs{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding:2px 0 14px;
  scrollbar-width:none;
}

.tabs::-webkit-scrollbar{
  display:none;
}

.day-tab{
  flex:0 0 auto;
  border:1px solid var(--line);
  background:#fff;
  color:#777a84;
  border-radius:15px;
  padding:11px 15px;
  font-weight:650;
}

.day-tab.active{
  background:var(--purple);
  color:#fff;
  border-color:var(--purple);
}

/* STUDENTS */

.student-grid{
  display:grid;
  gap:14px;
}

.student{
  padding:19px;
  border:1px solid var(--line);
  border-radius:22px;
  background:#fff;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}

.student-left{
  display:flex;
  align-items:center;
  gap:14px;
  min-width:0;
}

.student-avatar{
  width:48px;
  height:48px;
  border-radius:16px;
  background:var(--purple-soft);
  color:var(--purple);
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:750;
  font-size:17px;
  flex:none;
}

.student-name{
  font-weight:700;
  font-size:17px;
}

.student-note{
  font-size:14px;
  color:var(--muted);
  margin-top:4px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  max-width:210px;
}

/* MODAL */

.modal{
  position:fixed;
  inset:0;
  background:rgba(15,15,25,.38);
  display:none;
  align-items:flex-end;
  justify-content:center;
  z-index:20;
  padding:0;
}

.modal.show{
  display:flex;
}

.sheet{
  width:100%;
  max-width:620px;
  background:#fff;
  border-radius:30px 30px 0 0;
  padding:22px 24px calc(24px + env(safe-area-inset-bottom));
  max-height:92vh;
  overflow:auto;
}

.handle{
  width:42px;
  height:5px;
  border-radius:5px;
  background:#ddd;
  margin:0 auto 20px;
}

.sheet-title{
  font-size:25px;
  font-weight:750;
  margin-bottom:18px;
}

.form{
  display:grid;
  gap:13px;
}

label{
  font-size:13px;
  font-weight:650;
  color:#676a74;
}

input,
select,
textarea{
  width:100%;
  border:1px solid #dedee5;
  border-radius:15px;
  padding:13px 14px;
  background:#fafafd;
  color:var(--text);
  outline:none;
}

textarea{
  min-height:92px;
  resize:vertical;
}

input:focus,
select:focus,
textarea:focus{
  border-color:#aaa1f0;
  background:#fff;
}

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:8px;
}

/* NAVIGATION */

.bottom{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  height:80px;
  padding-bottom:env(safe-area-inset-bottom);
  background:rgba(255,255,255,.96);
  border-top:1px solid #e9e9ee;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  z-index:10;
}

.nav{
  border:0;
  background:transparent;
  color:#858891;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:5px;
  font-size:13px;
  font-weight:600;
}

.nav-icon{
  font-size:24px;
  line-height:1;
}

.nav.active{
  color:var(--purple);
}

/* PAGES */

.page{
  display:none;
}

.page.active{
  display:block;
}

/* BACK */

.back{
  border:0;
  background:transparent;
  padding:0;
  color:var(--purple);
  font-weight:650;
  font-size:15px;
  margin-bottom:14px;
}

/* PROFILE */

.profile-head{
  display:flex;
  gap:16px;
  align-items:center;
  margin-bottom:22px;
}

.profile-avatar{
  width:66px;
  height:66px;
  border-radius:22px;
  background:var(--purple-soft);
  color:var(--purple);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:23px;
  font-weight:750;
}

.profile-name{
  font-size:26px;
  font-weight:750;
}

.profile-level{
  color:var(--muted);
  margin-top:4px;
}

.info-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.info{
  background:#f8f8fb;
  border-radius:18px;
  padding:16px;
}

.info-label{
  color:var(--muted);
  font-size:13px;
}

.info-value{
  font-weight:700;
  margin-top:5px;
}

/* DESKTOP */

@media(min-width:700px){

  .top,
  .content{
    max-width:720px;
    margin:auto;
  }

  .bottom{
    max-width:720px;
    left:50%;
    right:auto;
    transform:translateX(-50%);
    width:100%;
  }
}
</style>
</head>

<body>

<div class="app">

<!-- HOME -->

<main id="homePage" class="page active">

  <div class="top">

    <div class="date" id="todayDate"></div>

    <div class="header">

      <div class="greeting" id="greeting"></div>

      <button
        class="avatar"
        onclick="showPage('studentsPage')"
        aria-label="Students">
        T
      </button>

    </div>

  </div>

  <div class="content">

    <div class="stats">

      <div class="stat lessons">

        <div
          class="stat-number"
          id="todayCount">
          0
        </div>

        <div class="stat-label">
          Today's lessons
        </div>

      </div>

      <div class="stat students">

        <div
          class="stat-number"
          id="studentCount">
          0
        </div>

        <div class="stat-label">
          Students
        </div>

      </div>

    </div>

    <div class="card">

      <div class="card-title">
        Today's schedule
      </div>

      <div class="card-sub">
        Your lessons for today
      </div>

      <div id="todaySchedule"></div>

    </div>

  </div>

</main>


<!-- SCHEDULE -->

<main id="schedulePage" class="page">

  <div class="top">

    <div class="date">
      Weekly planner
    </div>

    <div class="header">

      <div
        class="greeting"
        style="font-size:34px">
        Schedule
      </div>

      <button
        class="primary"
        onclick="openLessonModal()">
        + Add
      </button>

    </div>

  </div>

  <div class="content">

    <div class="card">

      <div
        class="tabs"
        id="dayTabs">
      </div>

      <div id="daySchedule"></div>

    </div>

  </div>

</main>


<!-- STUDENTS -->

<main id="studentsPage" class="page">

  <div class="top">

    <div class="date">
      Your students
    </div>

    <div class="header">

      <div
        class="greeting"
        style="font-size:34px">
        Students
      </div>

      <button
        class="primary"
        onclick="openStudentModal()">
        + Add
      </button>

    </div>

  </div>

  <div class="content">

    <div class="card">

      <div
        id="studentList"
        class="student-grid">
      </div>

    </div>

  </div>

</main>


<!-- STUDENT DETAIL -->

<main id="studentDetailPage" class="page">

  <div class="top">

    <button
      class="back"
      onclick="showPage('studentsPage')">
      ← Back to students
    </button>

    <div id="studentDetail"></div>

  </div>

</main>


<!-- BOTTOM NAV -->

<nav class="bottom">

  <button
    class="nav active"
    id="navHome"
    onclick="showPage('homePage')">

    <span class="nav-icon">⌂</span>
    <span>Home</span>

  </button>


  <button
    class="nav"
    id="navSchedule"
    onclick="showPage('schedulePage')">

    <span class="nav-icon">▦</span>
    <span>Schedule</span>

  </button>


  <button
    class="nav"
    id="navStudents"
    onclick="showPage('studentsPage')">

    <span class="nav-icon">♙</span>
    <span>Students</span>

  </button>

</nav>

</div>


<!-- ADD LESSON MODAL -->

<div
  class="modal"
  id="lessonModal">

  <div class="sheet">

    <div class="handle"></div>

    <div class="sheet-title">
      Add lesson
    </div>

    <form
      class="form"
      onsubmit="saveLesson(event)">

      <div>

        <label>
          Student
        </label>

        <select
          id="lessonStudent"
          required>
        </select>

      </div>


      <div>

        <label>
          Day
        </label>

        <select
          id="lessonDay"
          required>
        </select>

      </div>


      <div>

        <label>
          Time
        </label>

        <input
          id="lessonTime"
          type="time"
          required>

      </div>


      <div>

        <label>
          Duration
        </label>

        <select id="lessonDuration">

          <option value="45">
            45 minutes
          </option>

          <option
            value="60"
            selected>
            60 minutes
          </option>

          <option value="90">
            90 minutes
          </option>

          <option value="120">
            120 minutes
          </option>

        </select>

      </div>


      <div class="actions">

        <button
          type="button"
          class="secondary"
          onclick="closeModal('lessonModal')">
          Cancel
        </button>

        <button
          type="submit"
          class="primary">
          Save lesson
        </button>

      </div>

    </form>

  </div>

</div>


<!-- ADD STUDENT MODAL -->

<div
  class="modal"
  id="studentModal">

  <div class="sheet">

    <div class="handle"></div>

    <div class="sheet-title">
      Add student
    </div>

    <form
      class="form"
      onsubmit="saveStudent(event)">

      <div>

        <label>
          Name
        </label>

        <input
          id="studentName"
          required
          placeholder="Student name">

      </div>


      <div>

        <label>
          Level
        </label>

        <select id="studentLevel">

          <option>A1</option>
          <option>A2</option>
          <option>B1</option>
          <option>B2</option>
          <option>C1</option>
          <option>C2</option>

        </select>

      </div>


      <div>

        <label>
          Notes
        </label>

        <textarea
          id="studentNotes"
          placeholder="Notes about the student">
        </textarea>

      </div>


      <div class="actions">

        <button
          type="button"
          class="secondary"
          onclick="closeModal('studentModal')">
          Cancel
        </button>

        <button
          type="submit"
          class="primary">
          Save student
        </button>

      </div>

    </form>

  </div>

</div>


<script>

const KEY = "teacherPlanner_v3";


const defaultData = {

  students: [

    {
      id:1,
      name:"Aysel",
      level:"B1",
      notes:"Focus on speaking and vocabulary."
    },

    {
      id:2,
      name:"Murad",
      level:"A2",
      notes:"Needs extra practice with grammar."
    },

    {
      id:3,
      name:"Leyla",
      level:"C1",
      notes:"Advanced conversation and writing."
    }

  ],


  lessons: [

    {
      id:1,
      studentId:1,
      day:1,
      time:"10:00",
      duration:60
    },

    {
      id:2,
      studentId:2,
      day:3,
      time:"15:00",
      duration:60
    },

    {
      id:3,
      studentId:3,
      day:5,
      time:"18:30",
      duration:90
    }

  ]

};


let data =
  JSON.parse(
    localStorage.getItem(KEY) || "null"
  ) || defaultData;


let selectedDay =
  new Date().getDay();


let currentStudentId = null;


const days = [

  {
    value:1,
    name:"Monday",
    short:"Mon"
  },

  {
    value:2,
    name:"Tuesday",
    short:"Tue"
  },

  {
    value:3,
    name:"Wednesday",
    short:"Wed"
  },

  {
    value:4,
    name:"Thursday",
    short:"Thu"
  },

  {
    value:5,
    name:"Friday",
    short:"Fri"
  },

  {
    value:6,
    name:"Saturday",
    short:"Sat"
  },

  {
    value:0,
    name:"Sunday",
    short:"Sun"
  }

];


function persist(){

  localStorage.setItem(
    KEY,
    JSON.stringify(data)
  );

}


function getStudent(id){

  return data.students.find(
    s => Number(s.id) === Number(id)
  );

}


function greetingText(){

  const h =
    new Date().getHours();

  if(h >= 5 && h < 12){

    return "Good morning,<br>Sunshine ☀️";

  }

  if(h >= 12 && h < 18){

    return "Good afternoon,<br>Sunshine 🌤️";

  }

  return "Good evening,<br>Sunshine 🌙";

}


function formatDate(){

  return new Intl.DateTimeFormat(
    "en-US",
    {
      weekday:"long",
      month:"long",
      day:"numeric"
    }
  ).format(new Date());

}


function dayName(day){

  const item =
    days.find(
      d => d.value === Number(day)
    );

  return item ? item.name : "";

}


/* HOME */

function renderHome(){

  document.getElementById(
    "greeting"
  ).innerHTML =
    greetingText();


  document.getElementById(
    "todayDate"
  ).textContent =
    formatDate();


  document.getElementById(
    "studentCount"
  ).textContent =
    data.students.length;


  const today =
    new Date().getDay();


  const lessons =
    data.lessons

      .filter(
        l => Number(l.day) === today
      )

      .sort(
        (a,b) =>
          a.time.localeCompare(b.time)
      );


  document.getElementById(
    "todayCount"
  ).textContent =
    lessons.length;


  const box =
    document.getElementById(
      "todaySchedule"
    );


  if(!lessons.length){

    box.innerHTML =
      '<div class="empty">No lessons today 🌿</div>';

    return;

  }


  box.innerHTML =
    lessons.map(l => {

      const s =
        getStudent(l.studentId);


      return `

        <div class="lesson-row">

          <div class="lesson-main">

            <div class="lesson-name">
              ${escapeHtml(
                s?.name || "Student"
              )}
            </div>

            <div class="lesson-meta">
              ${escapeHtml(l.time)}
              ·
              ${l.duration} min
            </div>

          </div>

          <div class="badge">
            ${escapeHtml(
              s?.level || ""
            )}
          </div>

        </div>

      `;

    }).join("");

}


/* SCHEDULE */

function renderDayTabs(){

  document.getElementById(
    "dayTabs"
  ).innerHTML =

    days.map(d => `

      <button
        class="day-tab ${
          selectedDay === d.value
            ? "active"
            : ""
        }"
        onclick="selectDay(${d.value})">

        ${d.short}

      </button>

    `).join("");

}


function renderSchedule(){

  renderDayTabs();


  const lessons =
    data.lessons

      .filter(
        l =>
          Number(l.day) ===
          Number(selectedDay)
      )

      .sort(
        (a,b) =>
          a.time.localeCompare(b.time)
      );


  const box =
    document.getElementById(
      "daySchedule"
    );


  if(!lessons.length){

    box.innerHTML = `

      <div class="empty">

        No lessons on
        ${dayName(selectedDay)}
        🌿

      </div>

    `;

    return;

  }


  box.innerHTML =
    lessons.map(l => {

      const s =
        getStudent(l.studentId);


      return `

        <div class="lesson-row">

          <div class="lesson-main">

            <div class="lesson-name">
              ${escapeHtml(
                s?.name || "Student"
              )}
            </div>

            <div class="lesson-meta">

              ${escapeHtml(l.time)}
              ·
              ${l.duration} minutes
              ·
              ${dayName(l.day)}

            </div>

          </div>


          <div
            style="
              display:flex;
              align-items:center;
              gap:8px;
            ">

            <div class="badge">
              ${escapeHtml(
                s?.level || ""
              )}
            </div>

            <button
              class="danger"
              onclick="deleteLesson(${l.id})">

              Delete

            </button>

          </div>

        </div>

      `;

    }).join("");

}


/* STUDENTS */

function renderStudents(){

  const box =
    document.getElementById(
      "studentList"
    );


  if(!data.students.length){

    box.innerHTML =
      '<div class="empty">No students yet.</div>';

    return;

  }


  box.innerHTML =
    data.students.map(s => {

      const initials =
        s.name
          .trim()
          .split(/\s+/)
          .map(x => x[0])
          .join("")
          .slice(0,2)
          .toUpperCase();


      return `

        <div
          class="student"
          onclick="openStudent(${s.id})">

          <div class="student-left">

            <div class="student-avatar">

              ${escapeHtml(initials)}

            </div>


            <div>

              <div class="student-name">

                ${escapeHtml(s.name)}

              </div>


              <div class="student-note">

                ${escapeHtml(
                  s.notes || "No notes"
                )}

              </div>

            </div>

          </div>


          <div class="badge">

            ${escapeHtml(s.level)}

          </div>

        </div>

      `;

    }).join("");

}


/* STUDENT DETAIL */

function openStudent(id){

  currentStudentId = id;


  const s =
    getStudent(id);


  if(!s) return;


  const lessons =
    data.lessons

      .filter(
        l =>
          Number(l.studentId) ===
          Number(id)
      )

      .sort(
        (a,b) =>
          a.day - b.day ||
          a.time.localeCompare(b.time)
      );


  const initials =
    s.name
      .trim()
      .split(/\s+/)
      .map(x => x[0])
      .join("")
      .slice(0,2)
      .toUpperCase();


  document.getElementById(
    "studentDetail"
  ).innerHTML = `

    <div class="profile-head">

      <div class="profile-avatar">

        ${escapeHtml(initials)}

      </div>


      <div>

        <div class="profile-name">

          ${escapeHtml(s.name)}

        </div>


        <div class="profile-level">

          English ·
          ${escapeHtml(s.level)}

        </div>

      </div>

    </div>


    <div class="card">

      <div class="card-title">
        Overview
      </div>


      <div
        class="info-grid"
        style="margin-top:16px">

        <div class="info">

          <div class="info-label">
            Level
          </div>

          <div class="info-value">
            ${escapeHtml(s.level)}
          </div>

        </div>


        <div class="info">

          <div class="info-label">
            Lessons
          </div>

          <div class="info-value">
            ${lessons.length}
          </div>

        </div>

      </div>

    </div>


    <div class="card">

      <div class="card-title">
        Notes
      </div>


      <div
        class="card-sub"
        style="
          margin-top:12px;
          line-height:1.5;
        ">

        ${escapeHtml(
          s.notes || "No notes yet."
        )}

      </div>

    </div>


    <div class="card">

      <div class="card-title">
        Schedule
      </div>


      ${
        lessons.length

        ?

        lessons.map(l => `

          <div class="lesson-row">

            <div class="lesson-main">

              <div class="lesson-name">

                ${dayName(l.day)}

              </div>


              <div class="lesson-meta">

                ${escapeHtml(l.time)}
                ·
                ${l.duration} minutes

              </div>

            </div>

          </div>

        `).join("")

        :

        '<div class="empty">No lessons scheduled.</div>'
      }

    </div>


    <button
      class="danger"
      style="
        width:100%;
        padding:14px;
      "
      onclick="deleteStudent(${s.id})">

      Delete student

    </button>

  `;


  showPage(
    "studentDetailPage"
  );

}


/* DAY */

function selectDay(day){

  selectedDay = day;

  renderSchedule();

}


/* ADD LESSON */

function openLessonModal(){

  const sel =
    document.getElementById(
      "lessonStudent"
    );


  sel.innerHTML =
    data.students.map(s => `

      <option value="${s.id}">

        ${escapeHtml(s.name)}
        ·
        ${escapeHtml(s.level)}

      </option>

    `).join("");


  document.getElementById(
    "lessonDay"
  ).innerHTML =

    days.map(d => `

      <option
        value="${d.value}"
        ${
          d.value === selectedDay
            ? "selected"
            : ""
        }>

        ${d.name}

      </option>

    `).join("");


  document.getElementById(
    "lessonModal"
  ).classList.add("show");

}


/* ADD STUDENT */

function openStudentModal(){

  document.getElementById(
    "studentName"
  ).value = "";


  document.getElementById(
    "studentNotes"
  ).value = "";


  document.getElementById(
    "studentLevel"
  ).value = "A1";


  document.getElementById(
    "studentModal"
  ).classList.add("show");

}


/* CLOSE MODAL */

function closeModal(id){

  document.getElementById(
    id
  ).classList.remove("show");

}


/* SAVE LESSON */

function saveLesson(e){

  e.preventDefault();


  const lesson = {

    id:Date.now(),

    studentId:Number(
      document.getElementById(
        "lessonStudent"
      ).value
    ),

    day:Number(
      document.getElementById(
        "lessonDay"
      ).value
    ),

    time:
      document.getElementById(
        "lessonTime"
      ).value,

    duration:Number(
      document.getElementById(
        "lessonDuration"
      ).value
    )

  };


  data.lessons.push(
    lesson
  );


  persist();


  selectedDay =
    lesson.day;


  closeModal(
    "lessonModal"
  );


  renderAll();


  showPage(
    "schedulePage"
  );

}


/* SAVE STUDENT */

function saveStudent(e){

  e.preventDefault();


  const name =
    document
      .getElementById(
        "studentName"
      )
      .value
      .trim();


  if(!name) return;


  data.students.push({

    id:Date.now(),

    name:name,

    level:
      document.getElementById(
        "studentLevel"
      ).value,

    notes:
      document.getElementById(
        "studentNotes"
      ).value
      .trim()

  });


  persist();


  closeModal(
    "studentModal"
  );


  renderAll();

}


/* DELETE LESSON */

function deleteLesson(id){

  if(
    !confirm(
      "Delete this lesson?"
    )
  ) return;


  data.lessons =
    data.lessons.filter(
      l =>
        Number(l.id) !==
        Number(id)
    );


  persist();


  renderAll();

}


/* DELETE STUDENT */

function deleteStudent(id){

  if(
    !confirm(
      "Delete this student and their lessons?"
    )
  ) return;


  data.students =
    data.students.filter(
      s =>
        Number(s.id) !==
        Number(id)
    );


  data.lessons =
    data.lessons.filter(
      l =>
        Number(l.studentId) !==
        Number(id)
    );


  persist();


  renderAll();


  showPage(
    "studentsPage"
  );

}


/* PAGE NAVIGATION */

function showPage(id){

  document
    .querySelectorAll(".page")
    .forEach(
      p =>
        p.classList.remove("active")
    );


  document
    .getElementById(id)
    .classList.add("active");


  document
    .querySelectorAll(".nav")
    .forEach(
      n =>
        n.classList.remove("active")
    );


  if(id === "homePage"){

    document
      .getElementById("navHome")
      .classList.add("active");

  }


  if(id === "schedulePage"){

    document
      .getElementById("navSchedule")
      .classList.add("active");

  }


  if(
    id === "studentsPage" ||
    id === "studentDetailPage"
  ){

    document
      .getElementById("navStudents")
      .classList.add("active");

  }


  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* SECURITY */

function escapeHtml(value){

  return String(
    value ?? ""
  ).replace(
    /[&<>"']/g,
    m => ({

      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"

    }[m])
  );

}


/* RENDER */

function renderAll(){

  renderHome();

  renderSchedule();

  renderStudents();

}


renderAll();


/* UPDATE GREETING */

setInterval(
  () => {
    renderHome();
  },
  60000
);


/* CLOSE MODALS WHEN CLICKING OUTSIDE */

document
  .querySelectorAll(".modal")
  .forEach(modal => {

    modal.addEventListener(
      "click",
      e => {

        if(
          e.target === modal
        ){

          modal.classList.remove(
            "show"
          );

        }

      }
    );

  });

</script>

</body>
</html>
