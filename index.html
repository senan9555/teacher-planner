<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover">

  <meta name="theme-color" content="#f7f7fb">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Teacher Planner">

  <link rel="manifest" href="manifest.json">

  <title>Teacher Planner</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      background: #f7f7fb;
      color: #17181c;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        "Segoe UI",
        sans-serif;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    .app {
      width: 100%;
      max-width: 620px;
      min-height: 100vh;
      margin: auto;
      padding:
        calc(24px + env(safe-area-inset-top))
        18px
        calc(100px + env(safe-area-inset-bottom));
    }

    /* HEADER */

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }

    .small-date {
      color: #858791;
      font-size: 13px;
      margin-bottom: 5px;
    }

    .greeting {
      font-size: 28px;
      line-height: 1.1;
      font-weight: 750;
      letter-spacing: -0.8px;
    }

    .sunshine {
      display: block;
      margin-top: 3px;
    }

    .avatar {
      width: 46px;
      height: 46px;
      border-radius: 16px;
      background: #18191d;
      color: white;
      display: grid;
      place-items: center;
      font-weight: 700;
      font-size: 17px;
      box-shadow: 0 7px 18px rgba(0,0,0,.12);
    }

    /* CARDS */

    .card {
      background: white;
      border: 1px solid #ececf1;
      border-radius: 24px;
      padding: 18px;
      margin-bottom: 14px;
      box-shadow: 0 7px 25px rgba(0,0,0,.035);
    }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .section-title {
      font-size: 17px;
      font-weight: 720;
    }

    .section-subtitle {
      color: #858791;
      font-size: 12px;
      margin-top: 3px;
    }

    /* STATS */

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 14px;
    }

    .stat {
      border-radius: 20px;
      padding: 17px;
      background: #eeeeff;
    }

    .stat:nth-child(2) {
      background: #f0f7ff;
    }

    .stat-number {
      display: block;
      font-size: 27px;
      font-weight: 750;
      margin-bottom: 3px;
    }

    .stat-label {
      color: #70737e;
      font-size: 12px;
    }

    /* NEXT LESSON */

    .next-card {
      background: #18191d;
      color: white;
      border-radius: 24px;
      padding: 20px;
      margin-bottom: 14px;
      box-shadow: 0 10px 28px rgba(0,0,0,.12);
    }

    .next-label {
      color: #b9bac1;
      font-size: 12px;
      margin-bottom: 8px;
    }

    .next-name {
      font-size: 23px;
      font-weight: 720;
    }

    .next-meta {
      color: #c6c7cc;
      font-size: 13px;
      margin-top: 6px;
    }

    .next-time {
      font-size: 35px;
      font-weight: 750;
      margin-top: 15px;
      letter-spacing: -1px;
    }

    /* LESSONS */

    .lesson {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 13px 0;
      border-top: 1px solid #eeeeF2;
    }

    .lesson:first-child {
      border-top: 0;
    }

    .lesson-time {
      width: 55px;
      color: #555963;
      font-size: 13px;
      font-weight: 700;
    }

    .lesson-line {
      width: 7px;
      height: 40px;
      border-radius: 10px;
      background: #6b5cf5;
    }

    .lesson-info {
      flex: 1;
      min-width: 0;
    }

    .lesson-name {
      font-weight: 700;
      font-size: 15px;
    }

    .lesson-meta {
      color: #858791;
      font-size: 12px;
      margin-top: 3px;
    }

    .pill {
      background: #f0f0f4;
      border-radius: 10px;
      padding: 6px 8px;
      color: #646771;
      font-size: 11px;
      white-space: nowrap;
    }

    /* PAGE */

    .page {
      display: none;
    }

    .page.active {
      display: block;
    }

    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .page-title {
      font-size: 29px;
      font-weight: 750;
      letter-spacing: -.8px;
    }

    .page-subtitle {
      color: #858791;
      font-size: 13px;
      margin-top: 4px;
    }

    .add-button {
      background: #18191d;
      color: white;
      border-radius: 14px;
      padding: 11px 14px;
      font-weight: 650;
    }

    /* DAYS */

    .days {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 5px;
      margin-bottom: 16px;
    }

    .day {
      padding: 10px 2px;
      border-radius: 13px;
      text-align: center;
      color: #777a84;
      font-size: 11px;
    }

    .day.active {
      background: #18191d;
      color: white;
      font-weight: 700;
    }

    /* SCHEDULE */

    .schedule-row {
      display: flex;
      min-height: 82px;
      padding: 10px 0;
      border-top: 1px solid #eeeeF2;
    }

    .schedule-row:first-child {
      border-top: 0;
    }

    .schedule-time {
      width: 68px;
      color: #777a84;
      font-size: 11px;
      line-height: 1.5;
    }

    .schedule-slot {
      flex: 1;
      border-radius: 16px;
      padding: 12px;
      background: #f0f0ff;
    }

    .schedule-slot-name {
      font-size: 14px;
      font-weight: 700;
    }

    .schedule-slot-meta {
      color: #70737e;
      font-size: 12px;
      margin-top: 4px;
    }

    /* STUDENTS */

    .student-card {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .student-avatar {
      width: 47px;
      height: 47px;
      border-radius: 15px;
      background: #eeeeff;
      color: #5749df;
      display: grid;
      place-items: center;
      font-weight: 750;
      flex-shrink: 0;
    }

    .student-main {
      flex: 1;
      min-width: 0;
    }

    .student-name {
      font-size: 15px;
      font-weight: 700;
    }

    .student-meta {
      color: #81848d;
      font-size: 12px;
      margin-top: 4px;
    }

    .edit-button {
      background: #f0f0f4;
      color: #555862;
      padding: 7px 10px;
      border-radius: 10px;
      font-size: 11px;
    }

    /* MODAL */

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.42);
      display: none;
      align-items: flex-end;
      z-index: 50;
    }

    .modal.show {
      display: flex;
    }

    .sheet {
      width: 100%;
      max-width: 620px;
      max-height: 92vh;
      overflow-y: auto;
      margin: auto;
      background: white;
      border-radius: 28px 28px 0 0;
      padding:
        22px
        18px
        calc(25px + env(safe-area-inset-bottom));
    }

    .sheet-title {
      font-size: 22px;
      font-weight: 750;
      margin-bottom: 20px;
    }

    .field {
      margin-bottom: 13px;
    }

    .field label {
      display: block;
      color: #70737e;
      font-size: 12px;
      margin-bottom: 6px;
    }

    .field input,
    .field select,
    .field textarea {
      width: 100%;
      border: 1px solid #dedee5;
      background: #fafafd;
      border-radius: 14px;
      padding: 12px;
      outline: none;
    }

    .field textarea {
      min-height: 90px;
      resize: vertical;
    }

    .actions {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .action {
      flex: 1;
      padding: 13px;
      border-radius: 14px;
      font-weight: 650;
    }

    .cancel {
      background: #eeeeF2;
      color: #555862;
    }

    .save {
      background: #18191d;
      color: white;
    }

    /* EMPTY */

    .empty {
      padding: 30px 10px;
      text-align: center;
      color: #858791;
      font-size: 13px;
    }

    /* BOTTOM NAV */

    .bottom-nav {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 20;
      background: rgba(255,255,255,.94);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid #e8e8ed;
      padding-bottom: env(safe-area-inset-bottom);
    }

    .nav-inner {
      max-width: 620px;
      margin: auto;
      display: grid;
      grid-template-columns: repeat(3,1fr);
      padding: 8px 12px;
    }

    .nav-button {
      background: none;
      color: #858791;
      padding: 5px;
      font-size: 11px;
    }

    .nav-button.active {
      color: #5d4ff0;
      font-weight: 700;
    }

    .nav-icon {
      display: block;
      font-size: 21px;
      margin-bottom: 2px;
    }

    @media (min-width: 700px) {
      .bottom-nav {
        border-radius: 22px 22px 0 0;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <!-- HOME -->

  <section id="homePage" class="page active">

    <div class="header">

      <div>
        <div class="small-date" id="todayDate"></div>

        <div class="greeting" id="greeting">
          Good morning,
          <span class="sunshine">Sunshine ☀️</span>
        </div>
      </div>

      <div class="avatar">
        T
      </div>

    </div>


    <div class="stats">

      <div class="stat">
        <span class="stat-number" id="todayLessonsCount">0</span>
        <span class="stat-label">Today's lessons</span>
      </div>

      <div class="stat">
        <span class="stat-number" id="studentCount">0</span>
        <span class="stat-label">Students</span>
      </div>

    </div>


    <div id="nextLessonContainer"></div>


    <div class="card">

      <div class="section-head">

        <div>
          <div class="section-title">
            Today's schedule
          </div>

          <div class="section-subtitle">
            Your lessons for today
          </div>
        </div>

      </div>

      <div id="todayLessons"></div>

    </div>

  </section>


  <!-- SCHEDULE -->

  <section id="schedulePage" class="page">

    <div class="page-header">

      <div>
        <div class="page-title">
          Schedule
        </div>

        <div class="page-subtitle">
          Your weekly teaching plan
        </div>
      </div>

      <button
        class="add-button"
        onclick="openLessonModal()">

        + Lesson

      </button>

    </div>


    <div class="card">

      <div class="days" id="days"></div>

      <div id="scheduleList"></div>

    </div>

  </section>


  <!-- STUDENTS -->

  <section id="studentsPage" class="page">

    <div class="page-header">

      <div>
        <div class="page-title">
          Students
        </div>

        <div class="page-subtitle">
          Manage your students
        </div>
      </div>

      <button
        class="add-button"
        onclick="openStudentModal()">

        + Student

      </button>

    </div>


    <div id="studentsList"></div>

  </section>

</div>


<!-- BOTTOM NAV -->

<nav class="bottom-nav">

  <div class="nav-inner">

    <button
      class="nav-button active"
      onclick="showPage('homePage', this)">

      <span class="nav-icon">⌂</span>
      Home

    </button>


    <button
      class="nav-button"
      onclick="showPage('schedulePage', this)">

      <span class="nav-icon">▦</span>
      Schedule

    </button>


    <button
      class="nav-button"
      onclick="showPage('studentsPage', this)">

      <span class="nav-icon">♙</span>
      Students

    </button>

  </div>

</nav>


<!-- MODAL -->

<div class="modal" id="modal">

  <div class="sheet" id="sheet"></div>

</div>


<script>

const STORAGE_KEY = "teacherPlanner_v2";


let data =
  JSON.parse(
    localStorage.getItem(STORAGE_KEY)
  ) || {

    students: [

      {
        id: 1,
        name: "Aysel",
        level: "B1",
        days: "Mon, Wed",
        time: "18:00",
        duration: "60",
        notes: "Speaking practice"
      },

      {
        id: 2,
        name: "Murad",
        level: "A2",
        days: "Tue, Thu",
        time: "14:00",
        duration: "60",
        notes: ""
      },

      {
        id: 3,
        name: "Leyla",
        level: "B2",
        days: "Mon, Fri",
        time: "10:00",
        duration: "90",
        notes: "Exam preparation"
      }

    ],


    lessons: [

      {
        id: 1,
        studentId: 1,
        day: 1,
        time: "18:00"
      },

      {
        id: 2,
        studentId: 2,
        day: 2,
        time: "14:00"
      },

      {
        id: 3,
        studentId: 3,
        day: 1,
        time: "10:00"
      }

    ]

  };


const dayNames = [
  "Sun",
  "Mon",
  "Tue",
  "Wed",
  "Thu",
  "Fri",
  "Sat"
];


const dayShort = [
  "S",
  "M",
  "T",
  "W",
  "T",
  "F",
  "S"
];


const dayAz = [
  "Sun",
  "Mon",
  "Tue",
  "Wed",
  "Thu",
  "Fri",
  "Sat"
];


function saveData() {

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(data)
  );

}


function getStudent(id) {

  return data.students.find(
    s => s.id == id
  );

}


function escapeHTML(value) {

  return String(value || "")
    .replace(/[&<>"']/g, function(char) {

      return {

        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"

      }[char];

    });

}


/* GREETING */

function updateGreeting() {

  const hour =
    new Date().getHours();

  let greeting = "";

  if (hour >= 5 && hour < 12) {

    greeting = `
      Good morning,
      <span class="sunshine">
        Sunshine ☀️
      </span>
    `;

  }

  else if (hour >= 12 && hour < 18) {

    greeting = `
      Good afternoon,
      <span class="sunshine">
        Sunshine 🌤️
      </span>
    `;

  }

  else {

    greeting = `
      Good evening,
      <span class="sunshine">
        Sunshine 🌙
      </span>
    `;

  }


  document.getElementById(
    "greeting"
  ).innerHTML = greeting;

}


/* DATE */

function updateDate() {

  const date =
    new Intl.DateTimeFormat(
      "en-US",
      {
        weekday: "long",
        day: "numeric",
        month: "long"
      }
    ).format(new Date());


  document.getElementById(
    "todayDate"
  ).textContent = date;

}


/* PAGE */

function showPage(pageId, button) {

  document
    .querySelectorAll(".page")
    .forEach(page => {

      page.classList.remove(
        "active"
      );

    });


  document
    .getElementById(pageId)
    .classList.add("active");


  document
    .querySelectorAll(".nav-button")
    .forEach(btn => {

      btn.classList.remove(
        "active"
      );

    });


  button.classList.add("active");

  render();

}


/* TODAY */

function renderHome() {

  const today =
    new Date().getDay();


  const lessons =
    data.lessons
      .filter(
        lesson =>
          lesson.day == today
      )
      .sort(
        (a,b) =>
          a.time.localeCompare(
            b.time
          )
      );


  document.getElementById(
    "todayLessonsCount"
  ).textContent =
    lessons.length;


  document.getElementById(
    "studentCount"
  ).textContent =
    data.students.length;


  const container =
    document.getElementById(
      "todayLessons"
    );


  if (!lessons.length) {

    container.innerHTML = `
      <div class="empty">
        No lessons today 🌿
      </div>
    `;

  }

  else {

    container.innerHTML =
      lessons
        .map(
          createLessonHTML
        )
        .join("");

  }


  renderNextLesson(
    lessons
  );

}


function createLessonHTML(
  lesson
) {

  const student =
    getStudent(
      lesson.studentId
    );


  if (!student) {
    return "";
  }


  return `

    <div class="lesson">

      <div class="lesson-time">
        ${escapeHTML(
          lesson.time
        )}
      </div>

      <div class="lesson-line"></div>

      <div class="lesson-info">

        <div class="lesson-name">
          ${escapeHTML(
            student.name
          )}
        </div>

        <div class="lesson-meta">
          ${escapeHTML(
            student.level
          )}
          ·
          ${escapeHTML(
            student.duration
          )} min
        </div>

      </div>

      <div class="pill">
        ${escapeHTML(
          student.level
        )}
      </div>

    </div>

  `;

}


/* NEXT LESSON */

function renderNextLesson(
  lessons
) {

  const now =
    new Date();


  const currentTime =
    now.getHours() * 60 +
    now.getMinutes();


  let next =
    lessons.find(
      lesson => {

        const parts =
          lesson.time.split(":");

        const minutes =
          Number(parts[0]) * 60 +
          Number(parts[1]);

        return minutes >= currentTime;

      }
    );


  const container =
    document.getElementById(
      "nextLessonContainer"
    );


  if (!next) {

    container.innerHTML = "";

    return;

  }


  const student =
    getStudent(
      next.studentId
    );


  if (!student) {
    container.innerHTML = "";
    return;
  }


  container.innerHTML = `

    <div class="next-card">

      <div class="next-label">
        NEXT LESSON
      </div>

      <div class="next-name">
        ${escapeHTML(
          student.name
        )}
      </div>

      <div class="next-meta">
        ${escapeHTML(
          student.level
        )}
        ·
        ${escapeHTML(
          student.duration
        )} minutes
      </div>

      <div class="next-time">
        ${escapeHTML(
          next.time
        )}
      </div>

    </div>

  `;

}


/* SCHEDULE */

function renderSchedule() {

  const today =
    new Date().getDay();


  document.getElementById(
    "days"
  ).innerHTML =
    dayShort
      .map(
        (day,index) => `

          <div class="day ${
            index == today
              ? "active"
              : ""
          }">

            ${day}

          </div>

        `
      )
      .join("");


  const order = [
    1,2,3,4,5,6,0
  ];


  let html = "";


  order.forEach(
    day => {

      const lessons =
        data.lessons
          .filter(
            lesson =>
              lesson.day == day
          )
          .sort(
            (a,b) =>
              a.time.localeCompare(
                b.time
              )
          );


      lessons.forEach(
        lesson => {

          const student =
            getStudent(
              lesson.studentId
            );


          if (!student) {
            return;
          }


          html += `

            <div class="schedule-row">

              <div class="schedule-time">

                ${dayAz[day]}
                <br>
                ${escapeHTML(
                  lesson.time
                )}

              </div>


              <div class="schedule-slot">

                <div class="schedule-slot-name">

                  ${escapeHTML(
                    student.name
                  )}

                </div>

                <div class="schedule-slot-meta">

                  ${escapeHTML(
                    student.level
                  )}
                  ·
                  ${escapeHTML(
                    student.duration
                  )} min

                </div>

              </div>

            </div>

          `;

        }
      );

    }
  );


  document.getElementById(
    "scheduleList"
  ).innerHTML =
    html ||
    `
      <div class="empty">
        No lessons yet.
      </div>
    `;

}


/* STUDENTS */

function renderStudents() {

  const container =
    document.getElementById(
      "studentsList"
    );


  if (!data.students.length) {

    container.innerHTML = `

      <div class="empty">
        No students yet.
      </div>

    `;

    return;

  }


  container.innerHTML =
    data.students
      .map(
        student => `

          <div class="card student-card">

            <div class="student-avatar">

              ${escapeHTML(
                student.name
                  .charAt(0)
                  .toUpperCase()
              )}

            </div>


            <div class="student-main">

              <div class="student-name">

                ${escapeHTML(
                  student.name
                )}

              </div>


              <div class="student-meta">

                ${escapeHTML(
                  student.level
                )}
                ·
                ${escapeHTML(
                  student.days
                )}
                ·
                ${escapeHTML(
                  student.time
                )}

              </div>

            </div>


            <button
              class="edit-button"
              onclick="openStudentModal(${student.id})">

              Edit

            </button>

          </div>

        `
      )
      .join("");

}


/* STUDENT MODAL */

function openStudentModal(
  id = null
) {

  const student =
    id
      ? getStudent(id)
      : {

          name: "",
          level: "A1",
          days: "",
          time: "",
          duration: "60",
          notes: ""

        };


  document.getElementById(
    "sheet"
  ).innerHTML = `

    <div class="sheet-title">

      ${
        id
          ? "Edit student"
          : "New student"
      }

    </div>


    <div class="field">

      <label>
        Name
      </label>

      <input
        id="studentName"
        value="${escapeHTML(
          student.name
        )}"
        placeholder="Student name">

    </div>


    <div class="field">

      <label>
        Level
      </label>

      <select id="studentLevel">

        ${
          [
            "A1",
            "A2",
            "B1",
            "B2",
            "C1",
            "C2"
          ]
          .map(
            level => `

              <option
                value="${level}"
                ${
                  level ==
                  student.level
                    ? "selected"
                    : ""
                }>

                ${level}

              </option>

            `
          )
          .join("")
        }

      </select>

    </div>


    <div class="field">

      <label>
        Days
      </label>

      <input
        id="studentDays"
        value="${escapeHTML(
          student.days
        )}"
        placeholder="Mon, Wed">

    </div>


    <div class="field">

      <label>
        Lesson time
      </label>

      <input
        id="studentTime"
        type="time"
        value="${escapeHTML(
          student.time
        )}">

    </div>


    <div class="field">

      <label>
        Lesson duration
      </label>

      <select id="studentDuration">

        ${
          ["45","60","90","120"]
            .map(
              duration => `

                <option
                  value="${duration}"
                  ${
                    duration ==
                    student.duration
                      ? "selected"
                      : ""
                  }>

                  ${duration} minutes

                </option>

              `
            )
            .join("")
        }

      </select>

    </div>


    <div class="field">

      <label>
        Notes
      </label>

      <textarea
        id="studentNotes"
        placeholder="Notes about this student..."
      >${escapeHTML(
        student.notes
      )}</textarea>

    </div>


    <div class="actions">

      <button
        class="action cancel"
        onclick="closeModal()">

        Cancel

      </button>


      <button
        class="action save"
        onclick="saveStudent(${id || 0})">

        Save

      </button>

    </div>

  `;


  document.getElementById(
    "modal"
  ).classList.add("show");

}


/* SAVE STUDENT */

function saveStudent(id) {

  const name =
    document.getElementById(
      "studentName"
    ).value.trim();


  if (!name) {
    return;
  }


  const student = {

    id:
      id ||
      Date.now(),

    name,

    level:
      document.getElementById(
        "studentLevel"
      ).value,

    days:
      document.getElementById(
        "studentDays"
      ).value.trim(),

    time:
      document.getElementById(
        "studentTime"
      ).value,

    duration:
      document.getElementById(
        "studentDuration"
      ).value,

    notes:
      document.getElementById(
        "studentNotes"
      ).value.trim()

  };


  if (id) {

    data.students =
      data.students.map(
        existing =>
          existing.id == id
            ? student
            : existing
      );

  }

  else {

    data.students.push(
      student
    );

  }


  saveData();

  closeModal();

  render();

}


/* LESSON MODAL */

function openLessonModal() {

  if (!data.students.length) {

    openStudentModal();

    return;

  }


  document.getElementById(
    "sheet"
  ).innerHTML = `

    <div class="sheet-title">
      New lesson
    </div>


    <div class="field">

      <label>
        Student
      </label>

      <select id="lessonStudent">

        ${
          data.students
            .map(
              student => `

                <option
                  value="${student.id}">

                  ${escapeHTML(
                    student.name
                  )}
                  —
                  ${escapeHTML(
                    student.level
                  )}

                </option>

              `
            )
            .join("")
        }

      </select>

    </div>


    <div class="field">

      <label>
        Day
      </label>

      <select id="lessonDay">

        ${
          dayAz
            .map(
              (day,index) => `

                <option value="${index}">

                  ${day}

                </option>

              `
            )
            .join("")
        }

      </select>

    </div>


    <div class="field">

      <label>
        Time
      </label>

      <input
        id="lessonTime"
        type="time"
        value="18:00">

    </div>


    <div class="actions">

      <button
        class="action cancel"
        onclick="closeModal()">

        Cancel

      </button>


      <button
        class="action save"
        onclick="saveLesson()">

        Add lesson

      </button>

    </div>

  `;


  document.getElementById(
    "modal"
  ).classList.add("show");

}


/* SAVE LESSON */

function saveLesson() {

  const lesson = {

    id:
      Date.now(),

    studentId:
      Number(
        document.getElementById(
          "lessonStudent"
        ).value
      ),

    day:
      Number(
        document.getElementById(
          "lessonDay"
        ).value
      ),

    time:
      document.getElementById(
        "lessonTime"
      ).value

  };


  data.lessons.push(
    lesson
  );


  saveData();

  closeModal();

  render();

}


/* CLOSE MODAL */

function closeModal() {

  document.getElementById(
    "modal"
  ).classList.remove("show");

}


/* CLOSE BY BACKGROUND */

document
  .getElementById("modal")
  .addEventListener(
    "click",
    function(event) {

      if (
        event.target.id ===
        "modal"
      ) {

        closeModal();

      }

    }
  );


/* MAIN RENDER */

function render() {

  updateGreeting();

  updateDate();

  renderHome();

  renderSchedule();

  renderStudents();

}


/* START */

render();


/* UPDATE GREETING EVERY MINUTE */

setInterval(
  updateGreeting,
  60000
);

</script>

</body>
</html>
