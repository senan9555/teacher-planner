<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Teacher Planner — Admin</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
  background:#f6f7fb;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color:#222;
}

.card{
  width:100%;
  max-width:420px;
  background:#fff;
  border-radius:24px;
  padding:32px 24px;
  text-align:center;
  box-shadow:0 12px 35px rgba(0,0,0,.08);
}

.icon{
  font-size:42px;
  margin-bottom:12px;
}

h1{
  margin:0 0 8px;
  font-size:24px;
}

.subtitle{
  margin:0 0 28px;
  color:#777;
  font-size:14px;
}

.count{
  font-size:58px;
  font-weight:800;
  line-height:1;
  margin:20px 0 12px;
}

.label{
  color:#777;
  font-size:15px;
}

.refresh{
  margin-top:28px;
  border:0;
  border-radius:14px;
  padding:13px 20px;
  background:#5D78C8;
  color:white;
  font-size:15px;
  font-weight:600;
  cursor:pointer;
}

.refresh:active{
  transform:scale(.97);
}

.note{
  margin-top:24px;
  font-size:12px;
  line-height:1.5;
  color:#999;
}
</style>
</head>

<body>

<div class="card">

  <div class="icon">📊</div>

  <h1>Teacher Planner</h1>

  <p class="subtitle">Admin statistikası</p>

  <div class="count" id="count">—</div>

  <div class="label">ümumi səhifə açılışı</div>

  <button class="refresh" onclick="loadCount()">
    Yenilə
  </button>

  <div class="note">
    Bu rəqəm anonim ümumi ziyarət sayını göstərir.
    Unikal şəxsləri və onların kim olduğunu göstərmir.
  </div>

</div>

<script>
async function loadCount(){

  const el = document.getElementById("count");

  el.textContent = "…";

  try{

    const response = await fetch(
      "https://countapi.mileshilliard.com/api/v1/get/teacher_planner_visits_2026_8f4k2m91",
      {
        cache:"no-store"
      }
    );

    const data = await response.json();

    el.textContent = data.value ?? "—";

  }catch(error){

    el.textContent = "—";

  }
}

loadCount();
</script>

</body>
</html>
